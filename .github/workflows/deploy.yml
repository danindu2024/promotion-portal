name: Deploy to cPanel

on:
  push:
    branches:
      - main  
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Prevent infinite hanging on slow FTP connections

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v4

      - name: 🔑 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath, mysql
          coverage: none

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 💽 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🏗️ Install NPM dependencies & Build
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install
          npm run build

      - name: 📂 Sync Core Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./promotion_app/
          local-dir: ./
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/logs/**
            .env
            .env.example
            phpunit.xml
            .editorconfig
            README.md
            CHANGELOG.md
            *.sql
            /tmp/**
            .github/**
            public/**

      - name: 📂 Sync Public Assets via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/
          local-dir: ./public/
          timeout: 60000
