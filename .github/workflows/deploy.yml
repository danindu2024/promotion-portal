name: Deploy to cPanel

on:
  push:
    branches:
      - main  # Adjust this to your production branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Prevent infinite hanging on slow FTP connections

    steps:
      - name: 🚚 Checkout code
        uses: actions/checkout@v3

      - name: 🔑 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, bcmath, mysql
          coverage: none

      - name: 📦 Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 💽 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 🏗️ Install NPM dependencies & Build
        run: |
          npm install
          npm run build

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/  # Default cPanel root. Adjust if your site is in a subfolder.
          local-dir: ./
          timeout: 60000 # 60 second timeout for each file
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/logs/**
            .env
            phpunit.xml
            .editorconfig
            README.md
            CHANGELOG.md
            *.sql
            /tmp/**
